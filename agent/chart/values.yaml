image:
  repository: ghcr.io/domnicode/sayit-agent
  tag: "7e8453567a454db9786113257e4bf7bf940023d7"
  pullPolicy: IfNotPresent
# Zugangsdaten für das private GHCR-Paket (Secret liegt im Namespace sayit)
imagePullSecrets:
  - name: ghcr-pull
replicaCount: 1
containerPort: 8000
healthPath: /health
service:
  port: 80
ingress:
  enabled: true
  host: agent.dompah.de
  clusterIssuer: letsencrypt-prod
# CPU nur als Request (kein Limit -> kein künstliches Drosseln bei Echtzeit-Audio),
# Speicher zusätzlich begrenzt (Schutz vor Speicherlecks)
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
