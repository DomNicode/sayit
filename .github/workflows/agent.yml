name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/domnicode/sayit-agent

# Läufe nacheinander abarbeiten, damit sich zwei Tag-Commits nicht in die Quere kommen
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # GitOps: neuen Image-Tag ins Repo schreiben – Argo CD deployt daraufhin selbst
  update-tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Image-Tag in values.yaml setzen
        run: |
          yq -i '.image.tag = strenv(GITHUB_SHA) | .image.tag style="double"' agent/chart/values.yaml
          grep -n 'tag:' agent/chart/values.yaml

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/chart/values.yaml
          git commit -m "chore(agent): Image-Tag ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase
          git push
