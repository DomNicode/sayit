name: agent

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

# Standard für alle Jobs: nur lesen. Jobs mit mehr Bedarf setzen eigene Rechte.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/domnicode/sayit-agent

# Eine Warteschlange pro Branch: main läuft nacheinander (kein Tag-Konflikt),
# bei PRs bricht ein neuer Push den alten Lauf ab.
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Formatierung (ruff)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secrets-Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/dockerfile --error agent/

      - name: Abhängigkeiten und Konfiguration (Trivy)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /src/agent

  build:
    needs: [quality, security]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # GitOps: neuen Image-Tag ins Repo schreiben – Argo CD deployt daraufhin selbst
  update-tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Image-Tag in values.yaml setzen
        run: |
          yq -i '.image.tag = strenv(GITHUB_SHA) | .image.tag style="double"' agent/chart/values.yaml
          grep -n 'tag:' agent/chart/values.yaml

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/chart/values.yaml
          git commit -m "chore(agent): Image-Tag ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase
          git push